name: PR feed ad screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-feed-screenshots-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  capture_feed_screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build example APK
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          cd example-app
          bun install --frozen-lockfile
          VITE_CI_FEED=1 bun run build
          bunx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Capture feed screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          enable-kvm: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/capture-feed-screenshots-emulator.sh

      - name: Upload feed screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: feed-ad-screenshots
          path: |
            screenshots/feed-native-in-feed.png
            screenshots/feed-banner-in-feed.png
          if-no-files-found: error
