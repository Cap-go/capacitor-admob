appId: app.capgo.admob
---
- launchApp
- extendedWaitUntil:
    visible: ".*Feed events.*"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: feedStartButton
    commands:
      - tapOn:
          id: feedStartButton
- extendedWaitUntil:
    visible: ".*feed\\.load( |$).*"
    timeout: 120000
- assertVisible: ".*\"useWebViewNativeUiEngine\": false.*"